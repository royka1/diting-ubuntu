# Xiaomi Diting: sensor registry state of the SLPI (served by hexagonrpcd,
# diting-sensors.service), copied from the factory registry of
# firmware-xiaomi-diting when missing.
d /var/lib/diting-sensors 0755 root root -
C /var/lib/diting-sensors/registry - - - - /usr/share/qcom/sm8475/Xiaomi/diting/sensors/registry.factory
C /var/lib/diting-sensors/sns_reg_version - - - - /usr/share/qcom/sm8475/Xiaomi/diting/sensors/sns_reg_version.factory
