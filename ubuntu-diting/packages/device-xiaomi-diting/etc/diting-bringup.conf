# Xiaomi Diting bring-up: keep CoreSight/QDSS debug drivers from autoloading.
# The SM8450 DT enables these blocks; on a retail phone their registers may be
# inaccessible (debug fuses / QDSS clocks), and they are not needed. Remove
# this file to experiment with them.
blacklist coresight
blacklist coresight-tmc
blacklist coresight-funnel
blacklist coresight-replicator
blacklist coresight-stm
blacklist coresight-cti
blacklist coresight-tpda
blacklist coresight-tpdm
blacklist coresight-cpu-debug
blacklist coresight-catu
blacklist coresight-tpiu
