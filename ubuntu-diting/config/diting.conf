# Xiaomi Diting Ubuntu build configuration (sourced by scripts/lib.sh).
# Values marked VERIFIED were measured on the owner's 22081212UG unit
# (see docs/BOOT_LAYOUT.md); everything else is a build choice.

# --- Ubuntu ---------------------------------------------------------------
UBUNTU_SUITE="${UBUNTU_SUITE:-resolute}"          # 26.04 LTS
UBUNTU_VERSION_ID="${UBUNTU_VERSION_ID:-26.04}"
UBUNTU_MIRROR="${UBUNTU_MIRROR:-http://ports.ubuntu.com/ubuntu-ports}"
UBUNTU_COMPONENTS="main,universe"
# Ubuntu archive signing keys (2012 790BC727..C0B21F32, 2018 F6ECB376..991BC93C):
# the host's ubuntu-keyring, else the copy in config/keyrings (hosts without
# Debian tooling, e.g. openSUSE)
UBUNTU_KEYRING="${UBUNTU_KEYRING:-/usr/share/keyrings/ubuntu-archive-keyring.gpg}"
[ -f "$UBUNTU_KEYRING" ] || UBUNTU_KEYRING="$(dirname "${BASH_SOURCE[0]}")/keyrings/ubuntu-archive-keyring.gpg"
ROOTFS_HOSTNAME="diting"
ROOTFS_LOCALE="en_US.UTF-8"
ROOTFS_TIMEZONE="Etc/UTC"
ROOTFS_IMAGE_SIZE="${ROOTFS_IMAGE_SIZE:-10G}"
# Optional desktop: "" (headless), "phosh" (phosh-core) or "phosh-full"
# (phone desktop, Firefox, preseeded Chromium; config/packages-desktop.list)
ROOTFS_DESKTOP="${ROOTFS_DESKTOP-phosh-full}"
# "owner": firmware-xiaomi-diting from device-data if built, locked account
# with the build user's SSH key. "public": an image to share: never the
# local firmware (diting-firmware-setup extracts it on the phone), a
# default password (ROOTFS_PASSWORD) and no SSH keys.
ROOTFS_PROFILE="${ROOTFS_PROFILE:-owner}"
# DNS for the USB network (host does NAT: tools/diting-share-internet.sh)

# --- Kernel ---------------------------------------------------------------
KERNEL_LOCALVERSION="-diting"
KERNEL_DTB="qcom/sm8475-xiaomi-diting.dtb"
KERNEL_DEB_REVISION="41"

# --- Android boot image (VERIFIED from stock boot_b / vendor_boot_b) ------
BOOT_HEADER_VERSION=4
BOOT_PAGESIZE=4096
BOOT_OS_VERSION="12.0.0"
BOOT_OS_PATCH_LEVEL="2025-09"
VENDOR_BOOT_BASE=0x00000000
VENDOR_BOOT_KERNEL_OFFSET=0x00008000
VENDOR_BOOT_RAMDISK_OFFSET=0x01000000
VENDOR_BOOT_TAGS_OFFSET=0x00000100
VENDOR_BOOT_DTB_OFFSET=0x01f00000
# Partition sizes in bytes (VERIFIED: size of the raw dumps)
BOOT_PARTITION_SIZE=201326592
VENDOR_BOOT_PARTITION_SIZE=100663296
# ABL DTB selection ids copied from the vendor DTB (VERIFIED, /sys/firmware/fdt)
ABL_MSM_ID="531 65536 540 65536 530 65536"
ABL_BOARD_ID="65544 0"
# ABL looks up the continuous-splash buffer by node name (VERIFIED from UefiLog)
ABL_SPLASH_ADDR=0xb8000000

# Kernel command line for generated images. No root= here: the root
# location is chosen per test mode (see docs/SAFE_TESTING.md).
BOOT_CMDLINE_BASE="console=tty0 earlycon fw_devlink.sync_state=timeout"

# --- Deployment -------------------------------------------------------------
# Root filesystem location. Approved by the owner on 2026-10-11: Ubuntu on the
# userdata partition (Android wiped). Written to /etc/diting/cmdline in the
# rootfs (used by the on-device kernel hook) and used by BOOT_MODE=rootfs.
# diting.debug=usb keeps the USB gadget + initramfs shell during bring-up.
DITING_ROOT_CMDLINE="${DITING_ROOT_CMDLINE-root=PARTLABEL=userdata rw rootwait diting.debug=usb}"

# linux-msm/audioreach-topology commit for the loudspeaker topology macros
AUDIOREACH_TOPOLOGY_URL="https://github.com/linux-msm/audioreach-topology.git"
AUDIOREACH_TOPOLOGY_COMMIT="b4c1510fe6686ab8053715a02c34bec875ca5c6c"

# AudioReach graph services (ACDB parser for the voice call topology, which
# the local firmware package builds from the phone's own ACDB)
AUDIOREACH_GRAPHSERVICES_URL="https://github.com/AudioReach/audioreach-graphservices"
AUDIOREACH_GRAPHSERVICES_COMMIT="e0ecb6a1f10b9a0fced2de8101160e160ad02e5d"

# Qualcomm FastRPC userspace (adsprpcd: ADSP audio PD for the voice call's
# dynamically loaded modules); not packaged by Ubuntu
FASTRPC_URL="https://github.com/qualcomm/fastrpc"
FASTRPC_COMMIT="a56e9d4de3614a8d8f4b0e15ff561350c4b686e3"

# hexagonrpcd (file server for the sensor DSP), upstream plus the sensor
# registry methods from z3ntu/hexagonrpc apps_std_fwrite, ported in
# packages/hexagonrpc/patches; Ubuntu's 0.3.2 lacks them
HEXAGONRPC_URL="https://github.com/linux-msm/hexagonrpc"
HEXAGONRPC_COMMIT="da7a3742ab8d5273a281b70ee11f16fb2cb6a690"

# Sensor clients: libssc (QMI client for the SLPI's sensor core) and
# iio-sensor-proxy 3.9, the first release with SSC support (Ubuntu: 3.8)
LIBSSC_URL="https://codeberg.org/DylanVanAssche/libssc"
LIBSSC_COMMIT="54dd13e36d65c21263cf5b0f4a70c230a77b26bc"
IIO_SENSOR_PROXY_URL="https://gitlab.freedesktop.org/hadess/iio-sensor-proxy"
IIO_SENSOR_PROXY_COMMIT="0085ddf8ecb173a1c5fcf2344aa40e561125354f"
LIBVA_V4L2_URL="https://github.com/sky1-linux/libva-v4l2-stateful"
LIBVA_V4L2_COMMIT="6447ebbdd0bbbb7dd29c25d10986470f087ac436"
MOBILE_CONFIG_FIREFOX_URL="https://gitlab.postmarketos.org/postmarketOS/mobile-config-firefox.git"
MOBILE_CONFIG_FIREFOX_COMMIT="a07a58fe210652d45f9c8fe8d2a514d55f48ac9d"   # tag 5.4.1
